entities:
  seaf.company.ta.components.k8s_namespaces:
    title: &entity_title Kubernetes namespace
    description: &entity_description Логический namespace в кластере Kubernetes

    objects:
      k8s_namespace:
        route: "/"
        title: Namespace
        symbol: k8s_namespace

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            cluster:
              title: Кластер
              $ref: "#/$rels/seaf.company.ta.services.k8s.k8s"
            labels:
              title: Labels
              type: array
