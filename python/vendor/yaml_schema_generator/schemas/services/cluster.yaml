entities:
  seaf.company.ta.services.clusters:
    title: &entity_title Кластер вычислительных ресурсов
    description: &entity_description Логический кластер (БД, приложений, AD и пр.), объединяющий инфраструктуру и сети

    objects:
      cluster:
        route: "/"
        title: Кластер
        symbol: cluster

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            availabilityzone:
              title: Зоны доступности
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
            location:
              title: Локации
              description: ЦОДы или офисы, где размещён кластер
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                  - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            fqdn:
              title: FQDN
              type: string
            reservation_type:
              title: Тип резервирования
              type: string
            service_type:
              title: Тип сервиса
              type: string
            network_connection:
              title: Сетевые подключения
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
          required:
            - network_connection
