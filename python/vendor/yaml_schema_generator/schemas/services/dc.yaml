entities:
  seaf.company.ta.services.dcs:
    title: &entity_title Центр обработки данных
    description: &entity_description Площадка размещения инфраструктуры и инженерных мощностей компании

    objects:
      dc:
        route: "/"
        title: Центр обработки данных
        symbol: dc

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            vendor:
              title: Провайдер
              description: Организация, поставляющая услуги или площадку ЦОДа
              type: string
            ownership:
              title: Тип владения
              description: Собственный, арендованный или гибридный формат владения
              type: string
            type:
              title: Тип ЦОДа
              description: Основной, резервный и т.д.
              type: string
            address:
              title: Адрес
              description: Фактическое местонахождение ЦОДа
              type: string
            rack_qty:
              title: Количество стоек
              type: integer
              minimum: 0
            tier:
              title: Tier
              description: Класс надежности площадки
              type: string
            availabilityzone:
              title: Зона доступности
              description: Идентификатор зоны доступности, в которой расположен ЦОД
              $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
          required:
            - vendor
            - availabilityzone
