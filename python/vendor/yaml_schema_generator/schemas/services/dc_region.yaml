entities:
  seaf.company.ta.services.dc_regions:
    title: &entity_title Регион ЦОДов
    description: &entity_description Географическая область, где расположены один или несколько ЦОДов компании

    objects:
      dc_region:
        route: "/"
        title: Регион ЦОДов
        symbol: dc_region

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
