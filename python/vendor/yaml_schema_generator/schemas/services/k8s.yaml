entities:
  seaf.company.ta.services.k8s:
    title: &entity_title Kubernetes кластер
    description: &entity_description Кластер Kubernetes с интеграцией с сервисами безопасности, мониторинга и резервного копирования

    objects:
      k8s:
        route: "/"
        title: Kubernetes кластер
        symbol: k8s

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            fqdn:
              title: FQDN кластера
              type: string
            availabilityzone:
              title: Зоны доступности
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
            location:
              title: Локации
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                  - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            is_own:
              title: Кластер куплен как услуга
              type: boolean
            software:
              title: Версия/ПО Kubernetes
              type: string
            cni:
              title: CNI плагин
              type: string
            service_mesh:
              title: Service mesh
              type: string
            cluster_autoscaler:
              title: Автомасштабирование воркер-нод
              type: boolean
            management_networks:
              title: Управляющие сети
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
            network_connection:
              title: Сети для приложений
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
            registries:
              title: Разрешённые реестры/репозитории
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.kbs.kb"
            stand:
              title: Стенды
              description: Ссылки на стенды, к которым относится кластер
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.stands.stand"
          required:
            - software
            - cni
            - service_mesh
            - cluster_autoscaler
            - network_connection
            - registries