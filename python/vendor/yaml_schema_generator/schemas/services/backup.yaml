entities:
  seaf.company.ta.services.backups:
    title: &entity_title Сервис резервного копирования
    description: &entity_description Технический сервис, обеспечивающий хранение резервных копий и репликацию между площадками

    objects:
      backup:
        route: "/"
        title: Сервис резервного копирования
        symbol: backup

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            availabilityzone:
              title: Зоны доступности
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
            location:
              title: Локации
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                  - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            path:
              title: Путь хранения резервных копий
              type: string
            replication:
              title: Репликация в другой ЦОД
              type: boolean
            network_connection:
              title: Сетевые подключения
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
            backed_up_services:
              title: Резервируемые сервисы
              description: Список сервисов, для которых осуществляется резервное копирование данным сервисом
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.components.servers.server"
                  - $ref: "#/$rels/seaf.company.ta.components.hw_storages.hw_storage"
                  - $ref: "#/$rels/seaf.company.ta.components.networks.network_component"
                  - $ref: "#/$rels/seaf.company.ta.components.user_devices.user_device"
                  - $ref: "#/$rels/seaf.company.ta.services.k8s.k8s"
                  - $ref: "#/$rels/seaf.company.ta.services.compute_services.compute_service"
                  - $ref: "#/$rels/seaf.company.ta.services.cluster_virtualizations.cluster_virtualization"
                  - $ref: "#/$rels/seaf.company.ta.services.clusters.cluster"
                  - $ref: "#/$rels/seaf.company.ta.services.storages.storage"
                  - $ref: "#/$rels/seaf.company.ta.services.networks.network"
                  - $ref: "#/$rels/seaf.company.ta.services.kbs.kb"
                  - $ref: "#/$rels/seaf.company.ta.services.monitorings.monitoring"
          required:
            - path
            - network_connection
            - backed_up_services
