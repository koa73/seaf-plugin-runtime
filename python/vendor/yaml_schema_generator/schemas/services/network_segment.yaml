entities:
  seaf.company.ta.services.network_segments:
    title: &entity_title Сетевой сегмент
    description: &entity_description Логический сегмент сети (DMZ, INT-NET и др.), привязанный к конкретной площадке

    objects:
      network_segment:
        route: "/"
        title: Сетевой сегмент
        symbol: network_segment

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            location:
              title: Локация
              description: ЦОД или офис, в котором выделен сегмент
              anyOf:
                - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            zone:
              title: Зона
              description: Сокращённое имя сегмента (DMZ, WAN-EDGE и т.д.)
              type: string
          required:
            - location
            - zone
