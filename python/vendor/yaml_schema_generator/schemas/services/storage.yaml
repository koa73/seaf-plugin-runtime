entities:
  seaf.company.ta.services.storages:
    title: &entity_title Система хранения данных
    description: &entity_description Хранилища (SDS, объектные, файловые) и сервисы хранения данных

    objects:
      storage:
        route: "/"
        title: Хранилище
        symbol: storage

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          oneOf:
            - type: object
              properties:
                type:
                  title: Тип хранилища
                  enum:
                    - Software Defined Storage
                software:
                  title: ПО хранилища
                  type: string
                volume:
                  title: Объём, ТБ
                  type: integer
                  minimum: 0
                disk_type:
                  title: Тип дисков
                  type: string
                erasure_coding:
                  title: Код исправления ошибок
                  type: integer
                protocols:
                  title: Протоколы
                  type: string
                availabilityzone:
                  title: Зоны доступности
                  type: array
                  items:
                    $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
                location:
                  title: Локации
                  type: array
                  items:
                    anyOf:
                      - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                      - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
                network_connection:
                  title: Сетевые подключения
                  type: array
                  items:
                    $ref: "#/$rels/seaf.company.ta.services.networks.network"
              required:
                - type
                - software
                - volume
                - network_connection
            - type: object
              properties:
                type:
                  title: Тип хранилища
                  enum:
                    - Simple Storage Service
                software:
                  title: ПО сервиса
                  type: string
                availabilityzone:
                  title: Зоны доступности
                  type: array
                  items:
                    $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
                sla:
                  title: SLA
                  type: number
                network_connection:
                  title: Сетевые подключения
                  type: array
                  items:
                    $ref: "#/$rels/seaf.company.ta.services.networks.network"
                hw_storage_connected:
                  title: Подключенные аппаратные СХД
                  type: array
                  items:
                    $ref: "#/$rels/seaf.company.ta.components.hw_storages.hw_storage"
              required:
                - type
                - availabilityzone
                - network_connection
