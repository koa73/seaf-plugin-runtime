entities:
  seaf.company.ta.services.environments:
    title: &entity_title Окружение
    description: &entity_description Группы стендов (prod/dev/test и т.д.)

    objects:
      environment:
        route: "/"
        title: Окружение
        symbol: environment

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
