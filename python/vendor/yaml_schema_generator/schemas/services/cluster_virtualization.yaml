entities:
  seaf.company.ta.services.cluster_virtualizations:
    title: &entity_title Кластер виртуализации
    description: &entity_description Группа хостов гипервизора, предоставляющая ресурсы ВМ

    objects:
      cluster_virtualization:
        route: "/"
        title: Кластер виртуализации
        symbol: cluster_virtualization

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            hypervisor:
              title: Гипервизор
              type: string
            oversubscription_rate:
              title: Коэффициент переподписки
              type: number
              minimum: 0
            drs_support:
              title: DRS
              description: Поддержка распределения нагрузки (DRS)
              type: boolean
            sdrs_support:
              title: Storage DRS
              type: boolean
            availabilityzone:
              title: Зоны доступности
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.dc_azs.dc_az"
            location:
              title: Локации
              type: array
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.dcs.dc"
                  - $ref: "#/$rels/seaf.company.ta.services.dc_offices.dc_office"
            network_connection:
              title: Сетевые подключения
              type: array
              items:
                $ref: "#/$rels/seaf.company.ta.services.networks.network"
          required:
            - hypervisor
            - network_connection
