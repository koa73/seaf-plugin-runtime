entities:
  seaf.company.ta.services.network_links:
    title: &entity_title Сетевые связанности
    description: &entity_description Физические или логические каналы связи между сетями/устройствами

    objects:
      network_link:
        route: "/"
        title: Сетевой канал
        symbol: network_link

    schema:
      title: *entity_title
      description: *entity_description
      type: object
      additionalProperties: false

      patternProperties:
        "^([a-zA-Z0-9_-]+)(\\.[a-zA-Z0-9_-]+)+$":
          title: *entity_title
          description: *entity_description
          type: object
          allOf:
            - $ref: "#/$defs/seaf.company.ta.services.base.entity"
          properties:
            network_connection:
              title: Связанные сети
              type: array
              maxItems: 2
              items:
                anyOf:
                  - $ref: "#/$rels/seaf.company.ta.services.networks.network"
            typeL1:
              title: Технология L1
              type: string
            typeL2:
              title: Протокол L2
              type: string
            routing:
              title: Маршрутизация
              type: string
            encryption:
              title: Шифрование
              type: string
            encapsulation:
              title: Инкапсуляция / туннелирование
              type: string
            technology:
              title: Технология коммуникации
              type: string
            sla:
              title: SLA
              type: string
          required:
            - network_connection
