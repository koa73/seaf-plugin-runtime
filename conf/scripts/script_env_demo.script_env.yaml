title: Script Env Demo
persist: scriptDefaults
defaultsFile: scripts/script_env_demo.defaults.yaml
mergeGlobalEnv: true
fields:
  - label: Demo text value
    envKey: scriptEnvDemoText
    inputMethod: text
    helpText: "Тестовая строка для script_env_demo.py"
  - label: Demo mode
    envKey: scriptEnvDemoMode
    inputMethod: list
    options:
      - alpha
      - beta
  - label: Enable demo flag
    envKey: scriptEnvDemoFlag
    inputMethod: checkbox
