version: 1
commands:
  - id: seafInteractiveTerminalDemo
    menu:
      context:
        enabled: true
        scope: canvas
        target: any
  - id: seafReloadDocument
    menu:
      context:
        enabled: false
        target: selection_non_empty
  - id: seafAddPage
    title: Создать страницу
    script: context_menu/add_page.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
      includeCurrentPage: true
      includePages: true
    menu:
      context:
        enabled: true
        scope: stencil
        target: selection_single
        schemaPattern:
          - seaf.company.ta.services.dc_offices
          - seaf.company.ta.services.dcs
