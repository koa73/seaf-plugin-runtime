version: 1
commands:
  - id: seafAddPage
    title: Создать страницу
    script: context_menu/add_page.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
      includeCurrentPage: true
      includePages: true
    menu:
      main:
        enabled: false
      context:
        enabled: true
        scope: stencil
        target: selection_single
        schemaPattern:
          - seaf.company.ta.services.dc_offices
          - seaf.company.ta.services.dcs
  - id: seafLinkWithParent
    title: Связать с родителем
    script: context_menu/link_with_parent.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
      includeCurrentPage: true
    menu:
      main:
        enabled: false
      context:
        enabled: true
        scope: stencil
        target: selection_multi
