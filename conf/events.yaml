version: 1
enabled: true
schemaPrefix: "seaf."
defaultRuleId: "all"
stencilLists:
  - id: SEAF_Р41
    title: "SEAF_Р41"
rules:
  - id: exact_dc_azs
    listId: SEAF_Р41
    schema: "seaf.company.ta.services.dc_azs"
    execution: sync
    handlers:
      add: seafStencilAllAdd
      remove: seafStencilSpecificRemove
      modify: seafStencilSpecificModify
  - id: wildcard_ta_services
    listId: SEAF_Р41
    schema: "seaf.company.ta.*"
    execution: sync
    handlers:
      add: seafStencilAllAdd
  - id: all
    listId: SEAF_Р41
    schema: all
    execution: sync
    handlers:
      add: seafStencilAllAdd
      remove: seafStencilAllRemove
      modify: seafStencilAllModify
commands:
