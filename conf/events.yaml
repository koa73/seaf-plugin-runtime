version: 1
enabled: true
schemaPrefix: "seaf."
defaultRuleId: "wildcard_ta_services"
stencilLists:
  - id: SEAF_Р41
    title: "SEAF_Р41"
rules:
  - id: exact_dc_azs
    listId: SEAF_Р41
    schema: "seaf.company.ta.services.dc_azs"
    execution: sync
    handlers:
      add: seafStencilAllAdd
      reparent: seafStencilReparent
  - id: exact_dcs_data_mirror
    listId: SEAF_Р41
    schema: "seaf.company.ta.services.dcs"
    execution: sync
    handlers:
      add: seafStencilAllAdd
      reparent: seafStencilReparent
      modify: seafStencilDataMirrorModify
  - id: exact_dc_offices_data_mirror
    listId: SEAF_Р41
    schema: "seaf.company.ta.services.dc_offices"
    execution: sync
    handlers:
      add: seafStencilAllAdd
      reparent: seafStencilReparent
      modify: seafStencilDataMirrorModify
  - id: wildcard_ta_services
    listId: SEAF_Р41
    schema: "seaf.company.ta.*"
    execution: sync
    handlers:
      add: seafStencilAllAdd
      reparent: seafStencilReparent
      modify: seafStencilLabelTitleSync
commands:
  - id: seafStencilAllAdd
    title: SEAF Stencil All Add
    menu:
      main:
        enabled: false
      context:
        enabled: false
    script: events/all_add.py
    execution:
      mode: sync
      timeoutSec: 30
    input:
      includeDiagramXml: false
  - id: seafStencilReparent
    title: SEAF Stencil Reparent
    menu:
      main:
        enabled: false
      context:
        enabled: false
    script: events/reparent.py
    execution:
      mode: sync
      timeoutSec: 30
    input:
      includeDiagramXml: false
  - id: seafStencilDataMirrorModify
    title: SEAF Stencil Data Mirror Modify
    menu:
      main:
        enabled: false
      context:
        enabled: false
    script: events/data_mirror.py
    execution:
      mode: sync
      timeoutSec: 30
    input:
      includeDiagramXml: false
  - id: seafStencilLabelTitleSync
    title: SEAF Stencil Title Label Sync
    menu:
      main:
        enabled: false
      context:
        enabled: false
    script: events/label_title.py
    execution:
      mode: sync
      timeoutSec: 30
    input:
      includeDiagramXml: false
