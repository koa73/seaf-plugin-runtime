version: 1
commands:
  - id: seafEditConfig
    title: Edit Config
    clientAction: editConfig
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
    configEditor:
      title: Edit Config
      fields:
        - label: Company prefix
          envKey: companyPrefix
          inputMethod: text
          helpText: "Префикс для именования объектов модели SEAF"
        - label: Input SEAF file
          envKey: inputSeafFile
          inputMethod: filePicker
          fileDialog:
            title: Select Input SEAF file
            properties:
              - openFile
              - openDirectory
        - label: Use same output file
          envKey: useSameOutputFile
          inputMethod: checkbox
        - label: Output SEAF file
          envKey: outputSeafFile
          inputMethod: text
          syncFrom: inputSeafFile
          disableWhen:
            envKey: useSameOutputFile
            equals: true
        - label: Plugin logging
          envKey: pluginLogLevel
          inputMethod: list
          options:
            - none
            - info
            - debug
        - label: Script info logging
          envKey: scriptLogLevel
          inputMethod: list
          helpText: "Включает INFO-сообщения из Python скриптов в seaf-plugin.log. ERROR выводится всегда."
          options:
            - none
            - info
        - label: Python executable
          envKey: pythonExecutable
          inputMethod: filePicker
          helpText: "Путь к Python интерпретатору, который используется для запуска скриптов и установки зависимостей"
          fileDialog:
            title: Select Python executable
            properties:
              - openFile
              - openDirectory
  - id: seafP41Export
    title: Export
    script: main_menu/export.py
    execution:
      mode: async
      timeoutSec: 120
      pollIntervalMs: 500
      maxPollAttempts: 240
    input:
      includeDiagramXml: false
      includePages: true
      includeSchemaObjects: true
    indicator:
      enabled: true
      type: percent
      timeoutMs: 120000
      allowStop: false
    menu:
      main:
        enabled: true
        section: seaf
        submenu: p41
        submenuTitle: P41
  - id: seafP41Import
    title: Import
    script: main_menu/import.py
    execution:
      mode: async
      timeoutSec: 120
      pollIntervalMs: 500
      maxPollAttempts: 240
    input:
      includeDiagramXml: false
      includePages: true
      includeSchemaObjects: true
    indicator:
      enabled: true
      type: percent
      timeoutMs: 120000
      allowStop: false
    menu:
      main:
        enabled: true
        section: seaf
        submenu: p41
        submenuTitle: P41
  - id: seafToolsNetConfParser
    title: Net_Conf_Parser
    clientAction: interactiveTerminal
    script: main_menu/net_conf_parser.py
    execution:
      mode: interactive_terminal
      timeoutSec: 0
    input:
      includeDiagramXml: false
    scriptEnvEditor: scripts/net_conf_parser.script_env.yaml
    menu:
      main:
        enabled: true
        section: seaf
        submenu: tools
        submenuTitle: Tools
