version: 1
plugin:
  id: seaf_plugin
  name: SEAF Plugin
  description: Dynamic menu integration with Python scripts
  runtimeVersion: 0.2.5
python:
  executable: python3
  scriptsDir: ../python/scripts
logging:
  level: info
  extendedDebug: true
  includePayload: true
  output: both
  filePath: ../logs/seaf-plugin.log
update:
  enabled: true
  mode: ssh_git
  repo: ""
  gitRepoSsh: git@github.com:koa73/seaf-plugin-runtime.git
  gitRef: master
  assetPath: release/out/seaf-plugin-runtime.tar.gz
  expectedMinVersion: 0.2.5
  ssh:
    privateKeyPath: ../keys/seaf-plugin-runtime
    publicKeyPath: ../keys/seaf-plugin-runtime.pub
  assetName: seaf-plugin-runtime.tar.gz
  tag: ""
  apiBaseUrl: https://api.github.com
commands:
  - id: seafEditConfig
    title: Edit Config
    clientAction: editConfig
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
      context:
        enabled: false
        target: any
    configEditor:
      title: Edit Config
      fields:
        - label: Input file
          envKey: inputFile
          inputMethod: filePicker
          fileDialog:
            title: Select Input File
            properties:
              - openFile
        - label: Output file
          envKey: outputFile
          inputMethod: text
        - label: Processing mode
          envKey: processingMode
          inputMethod: list
          options:
            - fast
            - safe
        - label: Overwrite existing
          envKey: overwriteExisting
          inputMethod: checkbox
        - label: Output format
          envKey: outputFormat
          inputMethod: radio
          options:
            - json
            - xml
  - id: seafReloadDocument
    title: SEAF Reload Document
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
      context:
        enabled: true
        target: selection_non_empty
    script: success_reload.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
      includeCurrentPage: true
      arguments:
        operation: reload
    output:
      expectedStatus: success
    postActions:
      - name: showMessage
        args:
          level: info
          text: Reload command completed
      - name: reloadDocument
  - id: seafValidateSelection
    title: SEAF Validate Selection
    menu:
      main:
        enabled: true
        section: extras
      context:
        enabled: true
        target: selection_non_empty
    script: validate_selection.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: true
    output:
      expectedStatus: success
  - id: seafAsyncBackground
    title: SEAF Async Background Task
    menu:
      main:
        enabled: true
        section: seaf
      context:
        enabled: true
        target: any
    script: async_background.py
    execution:
      mode: async
      timeoutSec: 40
      pollIntervalMs: 1000
      maxPollAttempts: 120
    indicator:
      enabled: true
      type: percent
      timeoutMs: 40000
      allowStop: true
    input:
      includeDiagramXml: false
      arguments:
        simulateDurationSec: 3
    output:
      expectedStatus: success
  - id: seafFailureDemo
    title: SEAF Failure Demo
    menu:
      main:
        enabled: true
        section: seaf
      context:
        enabled: true
        target: any
    script: failure_demo.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
    output:
      expectedStatus: error
  - id: seafTimeoutDemo
    title: SEAF Timeout Demo
    menu:
      main:
        enabled: true
        section: seaf
      context:
        enabled: false
    script: timeout_demo.py
    execution:
      mode: sync
      timeoutSec: 1
    input:
      includeDiagramXml: false
      arguments:
        sleepSec: 5
    output:
      expectedStatus: error
