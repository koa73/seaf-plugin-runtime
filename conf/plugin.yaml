version: 1
plugin:
  id: seaf_plugin
  name: SEAF Plugin
  description: Dynamic menu integration with Python scripts
  runtimeVersion: 0.2.22
python:
  executable: python3
  requirementsFile: ../python/requirements.txt
  requiredModules:
    - lib.io
  scriptsDir: ../python/scripts
logging:
  level: info
  extendedDebug: true
  includePayload: true
  output: both
  filePath: ../logs/seaf-plugin.log
update:
  enabled: true
  mode: ssh_git
  repo: ""
  gitRepoSsh: git@github.com:koa73/seaf-plugin-runtime.git
  gitRef: master
  assetPath: release/out/seaf-plugin-runtime.tar.gz
  expectedMinVersion: 0.2.6
  ssh:
    privateKeyPath: ../keys/seaf-plugin-runtime
    publicKeyPath: ../keys/seaf-plugin-runtime.pub
  assetName: seaf-plugin-runtime.tar.gz
  tag: ""
  apiBaseUrl: https://api.github.com
commands:
  - id: seafEditConfig
    title: Edit Config
    clientAction: editConfig
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
      context:
        enabled: false
        target: any
    configEditor:
      title: Edit Config
      fields:
        - label: Company prefix
          envKey: companyPrefix
          inputMethod: text
          helpText: "Префикс для именования объектов модели SEAF"
        - label: Input SEAF file
          envKey: inputSeafFile
          inputMethod: filePicker
          fileDialog:
            title: Select Input SEAF file
            properties:
              - openFile
        - label: Use same output file
          envKey: useSameOutputFile
          inputMethod: checkbox
        - label: Output SEAF file
          envKey: outputSeafFile
          inputMethod: text
          syncFrom: inputSeafFile
          disableWhen:
            envKey: useSameOutputFile
            equals: true
        - label: Plugin logging
          envKey: pluginLogLevel
          inputMethod: list
          options:
            - none
            - info
            - debug
        - label: Python executable
          envKey: pythonExecutable
          inputMethod: filePicker
          helpText: "Путь к Python интерпретатору, который используется для запуска скриптов и установки зависимостей"
          fileDialog:
            title: Select Python executable
            properties:
              - openFile
              - openDirectory
  - id: seafInteractiveTerminalDemo
    title: SEAF Interactive Terminal Demo
    clientAction: interactiveTerminal
    script: examples/interactive_terminal_demo.py
    execution:
      mode: interactive_terminal
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
        submenu: examples
      context:
        enabled: false
        target: any
    input:
      includeDiagramXml: false
      includeCurrentPage: true
      arguments:
        demoMode: interactive_terminal
  - id: seafReloadDocument
    title: SEAF Reload Document
    menu:
      main:
        enabled: true
        section: seaf
        sectionTitle: SEAF
        submenu: examples
      context:
        enabled: true
        target: selection_non_empty
    script: examples/success_reload.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
      includeCurrentPage: true
      arguments:
        operation: reload
    output:
      expectedStatus: success
    postActions:
      - name: showMessage
        args:
          level: info
          text: Reload command completed
      - name: reloadDocument
  - id: seafValidateSelection
    title: SEAF Validate Selection
    menu:
      main:
        enabled: true
        section: extras
        submenu: examples
      context:
        enabled: true
        target: selection_non_empty
    script: examples/validate_selection.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: true
    output:
      expectedStatus: success
  - id: seafAsyncBackground
    title: SEAF Async Background Task
    menu:
      main:
        enabled: true
        section: seaf
        submenu: examples
      context:
        enabled: true
        target: any
    script: examples/async_background.py
    execution:
      mode: async
      timeoutSec: 40
      pollIntervalMs: 1000
      maxPollAttempts: 120
    indicator:
      enabled: true
      type: percent
      timeoutMs: 40000
      allowStop: true
    input:
      includeDiagramXml: false
      arguments:
        simulateDurationSec: 3
    output:
      expectedStatus: success
  - id: seafFailureDemo
    title: SEAF Failure Demo
    menu:
      main:
        enabled: true
        section: seaf
        submenu: examples
      context:
        enabled: true
        target: any
    script: examples/failure_demo.py
    execution:
      mode: sync
      timeoutSec: 20
    input:
      includeDiagramXml: false
    output:
      expectedStatus: error
  - id: seafTimeoutDemo
    title: SEAF Timeout Demo
    menu:
      main:
        enabled: true
        section: seaf
        submenu: examples
      context:
        enabled: false
    script: examples/timeout_demo.py
    execution:
      mode: sync
      timeoutSec: 1
    input:
      includeDiagramXml: false
      arguments:
        sleepSec: 5
    output:
      expectedStatus: error
