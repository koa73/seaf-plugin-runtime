version: 1
plugin:
  id: seaf_plugin
  name: SEAF Plugin
  description: Dynamic menu integration with modular config includes
  runtimeVersion: 0.6.5
python:
  executable: python3
  requirementsFile: ../python/requirements.txt
  requiredModules:
    - lib.io
  scriptsDir: ../python/scripts
logging:
  level: info
  extendedDebug: true
  includePayload: true
  output: both
  filePath: ../logs/seaf-plugin.log
update:
  enabled: true
  mode: github_release
  repo: koa73/seaf-plugin-runtime
  expectedMinVersion: 0.2.6
  assetName: seaf-plugin-runtime.tar.gz
  tag: latest
  apiBaseUrl: https://api.github.com
events:
  configFile: events.yaml
includes:
  menus:
    main: main_menu.yaml
    context: context_menu.yaml
  events:
    commands: events.yaml
